<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dein Hausmeister · Beta v0.2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
    html,body,#root{height:100%;}
    body{background:#0e1822;color:#fff;font-family:'Figtree',system-ui,sans-serif;}
    #root{display:flex;flex-direction:column;}
    @keyframes scan{0%{top:15%;}50%{top:78%;}100%{top:15%;}}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.6;}}
    ::-webkit-scrollbar{width:5px;height:5px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:99px;}
    select,input,textarea,button{font-family:'Figtree',system-ui,sans-serif;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

/* ── Theme ──────────────────────────────────────────────── */
const F  = "'Figtree', system-ui, sans-serif";
const GR = "#43A047", GD = "#2E7D32", GL = "#E8F5E9";
const BG = "#F4F6F9", WH = "#FFFFFF";
const TX = "#111827", T2 = "#374151", MU = "#6B7280", ML = "#9CA3AF";
const BR = "#E5E7EB", B2 = "#F9FAFB";
const OR = "#FB8C00", BL = "#2563EB", RE = "#DC2626", PU = "#7C3AED";
const SB = "#1C2538";

const statusStyle = s => ({
  "In Arbeit":{c:OR,bg:"#FFF3E0"},
  "Neu":{c:BL,bg:"#EFF6FF"},
  "Zugewiesen":{c:PU,bg:"#F5F3FF"},
  "Erledigt":{c:GR,bg:GL},
  "Offen":{c:MU,bg:B2},
  "Bezahlt":{c:GR,bg:GL},
}[s] || {c:MU,bg:B2});

/* ── Shared Components ──────────────────────────────────── */

function Pill({ s, small }) {
  const { c, bg } = statusStyle(s);
  return (
    <span style={{background:bg,color:c,borderRadius:20,
      padding:small?"2px 8px":"3px 11px",
      fontSize:small?10:11,fontWeight:700,whiteSpace:"nowrap"}}>
      {s}
    </span>
  );
}

function GBtn({ label, onClick, variant="fill" }) {
  return (
    <button onClick={onClick}
      onMouseEnter={e=>{e.currentTarget.style.transform="scale(1.02)";e.currentTarget.style.opacity=".93";}}
      onMouseLeave={e=>{e.currentTarget.style.transform="none";e.currentTarget.style.opacity="1";}}
      style={{width:"100%",padding:"13px 0",borderRadius:13,cursor:"pointer",
        fontFamily:F,fontWeight:700,fontSize:14,transition:"all .15s",
        background:variant==="fill"?`linear-gradient(150deg,${GR},${GD})`:WH,
        color:variant==="fill"?"#fff":TX,
        border:variant==="out"?`1.5px solid ${BR}`:"none",
        boxShadow:variant==="fill"?`0 4px 14px ${GR}44`:"none"}}>
      {label}
    </button>
  );
}

function Phone({ children, dark }) {
  return (
    <div style={{width:300,height:620,borderRadius:40,border:"7px solid #111",
      background:dark?"#000":BG,overflow:"hidden",flexShrink:0,
      boxShadow:"0 28px 70px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06)",
      display:"flex",flexDirection:"column",position:"relative"}}>
      <div style={{position:"absolute",top:0,left:"50%",transform:"translateX(-50%)",
        width:82,height:20,background:"#111",borderRadius:"0 0 12px 12px",zIndex:30}}/>
      <div style={{height:32,display:"flex",alignItems:"center",justifyContent:"space-between",
        padding:"0 18px",flexShrink:0,position:"relative",zIndex:20}}>
        <span style={{fontSize:11,fontWeight:800,color:dark?"#fff":TX,letterSpacing:-0.3}}>9:41</span>
        <div style={{display:"flex",gap:3,alignItems:"flex-end"}}>
          {[5,8,11,14].map((h,i)=>(
            <div key={i} style={{width:2.5,height:h,background:dark?"#fff":TX,
              borderRadius:1,opacity:i===3?0.35:1}}/>
          ))}
          <div style={{width:2,height:2}}/>
          <div style={{width:12,height:6,border:`1.5px solid ${dark?"#fff":TX}`,
            borderRadius:2,display:"flex",alignItems:"center",paddingLeft:1}}>
            <div style={{width:"60%",height:3.5,background:dark?"#fff":TX,borderRadius:0.5}}/>
          </div>
        </div>
      </div>
      <div style={{flex:1,overflow:"auto",display:"flex",flexDirection:"column"}}>
        {children}
      </div>
    </div>
  );
}

function BotNav({ active, onTab }) {
  return (
    <div style={{height:64,background:WH,borderTop:`1px solid ${BR}`,
      display:"flex",justifyContent:"space-around",alignItems:"center",flexShrink:0}}>
      {[["d","🏠","Dashboard"],["t","✅","Aufgaben"],["m","🔔","Meldungen"],["x","☰","Mehr"]].map(([k,ic,lb])=>(
        <div key={k} onClick={()=>onTab(k)}
          style={{display:"flex",flexDirection:"column",alignItems:"center",
            gap:2,cursor:"pointer",flex:1,userSelect:"none"}}>
          <span style={{fontSize:18,filter:active===k?"none":"grayscale(100%)",
            opacity:active===k?1:0.4,transition:"all .15s"}}>{ic}</span>
          <span style={{fontSize:9,color:active===k?GR:MU,fontWeight:active===k?700:400}}>{lb}</span>
        </div>
      ))}
    </div>
  );
}

function MobHead({ back, title, right, onBack }) {
  return (
    <div style={{background:WH,padding:"10px 14px",display:"flex",alignItems:"center",
      justifyContent:"space-between",borderBottom:`1px solid ${BR}`,flexShrink:0}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        {back && <span onClick={onBack} style={{fontSize:20,cursor:"pointer",color:BL,lineHeight:1}}>‹</span>}
        <span style={{fontWeight:700,fontSize:14,color:TX}}>{title}</span>
      </div>
      {right && <span style={{color:MU,fontSize:18}}>{right}</span>}
    </div>
  );
}

function Sidebar({ items, active, onNav }) {
  return (
    <div style={{width:206,background:SB,display:"flex",flexDirection:"column",flexShrink:0}}>
      <div style={{padding:"16px 14px 13px",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          <div style={{width:30,height:30,borderRadius:8,
            background:`linear-gradient(135deg,${GR},${GD})`,
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,flexShrink:0}}>🏠</div>
          <div style={{color:"#fff",fontSize:11,fontWeight:800,lineHeight:1.25}}>
            Hausmeister<br/>Management
          </div>
        </div>
      </div>
      <nav style={{flex:1,padding:"8px 6px",overflowY:"auto"}}>
        {items.map(([k,ic,lb])=>(
          <div key={k} onClick={()=>onNav(k)}
            onMouseEnter={e=>{if(active!==k)e.currentTarget.style.background="rgba(255,255,255,0.05)";}}
            onMouseLeave={e=>{if(active!==k)e.currentTarget.style.background="transparent";}}
            style={{display:"flex",alignItems:"center",gap:9,padding:"8px 10px",
              borderRadius:7,cursor:"pointer",marginBottom:1,transition:"all .12s",
              background:active===k?"rgba(67,160,71,0.15)":"transparent",
              color:active===k?"#fff":"rgba(255,255,255,0.5)",
              borderLeft:active===k?`2px solid ${GR}`:"2px solid transparent"}}>
            <span style={{fontSize:14}}>{ic}</span>
            <span style={{fontSize:12,fontWeight:active===k?700:400}}>{lb}</span>
          </div>
        ))}
      </nav>
    </div>
  );
}

function WebBar({ title, avatar }) {
  return (
    <div style={{height:52,background:WH,borderBottom:`1px solid ${BR}`,
      display:"flex",alignItems:"center",justifyContent:"space-between",
      padding:"0 22px",flexShrink:0}}>
      <div style={{color:TX,fontWeight:700,fontSize:15}}>{title}</div>
      <div style={{display:"flex",gap:10,alignItems:"center"}}>
        <div style={{background:BG,border:`1px solid ${BR}`,borderRadius:8,
          padding:"5px 12px",fontSize:11,color:MU,cursor:"pointer"}}>🔔</div>
        <div style={{width:30,height:30,borderRadius:99,background:GR,
          display:"flex",alignItems:"center",justifyContent:"center",
          color:"#fff",fontSize:12,fontWeight:800}}>{avatar}</div>
      </div>
    </div>
  );
}

/* ── QR Flow ─────────────────────────────────────────────── */

function QRFlow() {
  const [sc, setSc] = useState(0);
  const labels = ["QR-Code scannen","Schaden melden","Meldung eingereicht","Status verfolgen"];

  const Screen0 = (
    <div key={0} style={{flex:1,background:"#0a0a0a",display:"flex",flexDirection:"column"}}>
      <MobHead title="QR-Code scannen"/>
      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",
        justifyContent:"center",gap:18,padding:24}}>
        <div style={{width:190,height:190,position:"relative"}}>
          {[{t:0,l:0,bt:"top",bl:"left"},{t:0,r:0,bt:"top",bl:"right"},
            {b:0,l:0,bt:"bottom",bl:"left"},{b:0,r:0,bt:"bottom",bl:"right"}].map((pos,i)=>(
            <div key={i} style={{position:"absolute",
              top:pos.t!==undefined?pos.t:undefined,
              bottom:pos.b!==undefined?pos.b:undefined,
              left:pos.l!==undefined?pos.l:undefined,
              right:pos.r!==undefined?pos.r:undefined,
              width:30,height:30,
              borderTop:pos.bt==="top"?`3px solid ${GR}`:"none",
              borderBottom:pos.bt==="bottom"?`3px solid ${GR}`:"none",
              borderLeft:pos.bl==="left"?`3px solid ${GR}`:"none",
              borderRight:pos.bl==="right"?`3px solid ${GR}`:"none"}}/>
          ))}
          <div style={{position:"absolute",left:4,right:4,height:2,top:"25%",
            background:`linear-gradient(90deg,transparent,${GR},transparent)`,
            animation:"scan 2s ease-in-out infinite"}}/>
          <div style={{position:"absolute",inset:24,display:"grid",
            gridTemplateColumns:"repeat(6,1fr)",gap:2,opacity:0.5}}>
            {Array(36).fill(0).map((_,i)=>(
              <div key={i} style={{background:[0,1,2,3,4,5,6,12,18,24,30,31,32,33,34,35,7,8,9,10,11,25,26,27,28,29,16,17].includes(i)?GR:"transparent",borderRadius:1}}/>
            ))}
          </div>
        </div>
        <p style={{color:"rgba(255,255,255,0.6)",fontSize:12,textAlign:"center",lineHeight:1.6}}>
          Richte die Kamera auf den QR-Code<br/>am Objekt, um Schäden zu melden
        </p>
        <button onClick={()=>setSc(1)} style={{background:GR,color:"#fff",border:"none",
          borderRadius:22,padding:"9px 22px",fontSize:12,fontWeight:700,cursor:"pointer",
          boxShadow:`0 4px 14px ${GR}55`,fontFamily:F}}>Demo: Weiter →</button>
      </div>
      <div style={{display:"flex",background:"#111",borderTop:"1px solid rgba(255,255,255,0.08)",flexShrink:0}}>
        {[["📷","Scan"],["🕐","Verlauf"]].map(([ic,lb],i)=>(
          <div key={lb} style={{flex:1,padding:"10px 0",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
            <span style={{fontSize:18,color:i===0?GR:"rgba(255,255,255,0.4)"}}>{ic}</span>
            <span style={{fontSize:9,color:i===0?GR:"rgba(255,255,255,0.4)",fontWeight:i===0?700:400}}>{lb}</span>
          </div>
        ))}
      </div>
    </div>
  );

  const Screen1 = (
    <div key={1} style={{flex:1,background:BG,display:"flex",flexDirection:"column"}}>
      <MobHead back title="Schaden melden" onBack={()=>setSc(0)}/>
      <div style={{flex:1,overflow:"auto",padding:12,display:"flex",flexDirection:"column",gap:10}}>
        <div style={{background:WH,borderRadius:12,padding:13,boxShadow:"0 1px 5px rgba(0,0,0,0.07)"}}>
          <div style={{color:MU,fontSize:9,fontWeight:800,letterSpacing:0.8,marginBottom:8}}>OBJEKT</div>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            <div style={{width:32,height:32,borderRadius:9,background:GL,
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>🏠</div>
            <div>
              <div style={{color:TX,fontWeight:700,fontSize:12}}>Wohnanlage Sonnenweg 12</div>
              <div style={{color:MU,fontSize:10}}>Sonnenweg 12, 12345 Musterstadt</div>
            </div>
          </div>
        </div>
        <div style={{background:WH,borderRadius:12,padding:13,boxShadow:"0 1px 5px rgba(0,0,0,0.07)"}}>
          <div style={{color:MU,fontSize:9,fontWeight:800,letterSpacing:0.8,marginBottom:8}}>BESCHREIBUNG *</div>
          <textarea defaultValue="Wasserleck im Keller, es steht Wasser auf dem Boden."
            style={{width:"100%",minHeight:65,background:BG,border:`1px solid ${BR}`,
              borderRadius:9,padding:"8px 10px",fontSize:12,color:TX,outline:"none",
              resize:"none",boxSizing:"border-box",fontFamily:F,lineHeight:1.5}}/>
        </div>
        <div style={{background:WH,borderRadius:12,padding:13,boxShadow:"0 1px 5px rgba(0,0,0,0.07)"}}>
          <div style={{color:MU,fontSize:9,fontWeight:800,letterSpacing:0.8,marginBottom:8}}>FOTO HINZUFÜGEN</div>
          <div style={{border:`2px dashed ${BR}`,borderRadius:10,padding:"18px 0",
            display:"flex",flexDirection:"column",alignItems:"center",gap:5,background:BG,cursor:"pointer"}}>
            <div style={{width:40,height:40,borderRadius:10,background:WH,border:`1px solid ${BR}`,
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>📷</div>
            <span style={{color:MU,fontSize:11}}>Foto aufnehmen oder auswählen</span>
          </div>
        </div>
        <GBtn label="Meldung senden" onClick={()=>setSc(2)}/>
      </div>
    </div>
  );

  const Screen2 = (
    <div key={2} style={{flex:1,background:BG,display:"flex",flexDirection:"column",
      alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{width:76,height:76,borderRadius:99,
        background:`linear-gradient(135deg,${GR},${GD})`,
        display:"flex",alignItems:"center",justifyContent:"center",fontSize:36,color:"#fff",
        marginBottom:22,boxShadow:`0 8px 28px ${GR}55`}}>✓</div>
      <div style={{color:TX,fontWeight:800,fontSize:20,textAlign:"center",marginBottom:8}}>Meldung eingereicht!</div>
      <div style={{color:MU,fontSize:12,textAlign:"center",lineHeight:1.7,marginBottom:26}}>
        Vielen Dank. Ihre Meldung wurde<br/>erfolgreich übermittelt.
      </div>
      <div style={{background:WH,borderRadius:13,padding:"14px 32px",textAlign:"center",
        boxShadow:"0 2px 12px rgba(0,0,0,0.07)",marginBottom:26}}>
        <div style={{color:MU,fontSize:9,letterSpacing:0.8,marginBottom:4}}>MELDUNGSNUMMER</div>
        <div style={{color:TX,fontWeight:900,fontSize:18,letterSpacing:-0.3}}>#2024-000123</div>
      </div>
      <GBtn label="Zurück zur Startseite" onClick={()=>setSc(0)}/>
      <button onClick={()=>setSc(3)} style={{marginTop:12,background:"none",border:"none",
        color:GR,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:F}}>
        Status verfolgen →
      </button>
    </div>
  );

  const Screen3 = (
    <div key={3} style={{flex:1,background:BG,display:"flex",flexDirection:"column"}}>
      <MobHead back title="Meldung #2024-000123" onBack={()=>setSc(2)}/>
      <div style={{flex:1,overflow:"auto",padding:12,display:"flex",flexDirection:"column",gap:10}}>
        <div style={{background:WH,borderRadius:12,padding:13,boxShadow:"0 1px 5px rgba(0,0,0,0.07)"}}>
          <div style={{color:MU,fontSize:9,fontWeight:800,letterSpacing:0.8,marginBottom:6}}>OBJEKT</div>
          <div style={{color:TX,fontWeight:700,fontSize:12}}>Wohnanlage Sonnenweg 12</div>
          <div style={{color:MU,fontSize:10}}>Sonnenweg 12, 12345 Musterstadt</div>
        </div>
        <div style={{background:WH,borderRadius:12,padding:13,boxShadow:"0 1px 5px rgba(0,0,0,0.07)"}}>
          <div style={{color:MU,fontSize:9,fontWeight:800,letterSpacing:0.8,marginBottom:8}}>STATUS</div>
          <span style={{background:"#FFF3E0",color:"#FB8C00",borderRadius:20,padding:"3px 11px",fontSize:11,fontWeight:700}}>In Arbeit</span>
        </div>
        <div style={{background:WH,borderRadius:12,padding:13,boxShadow:"0 1px 5px rgba(0,0,0,0.07)"}}>
          <div style={{color:MU,fontSize:9,fontWeight:800,letterSpacing:0.8,marginBottom:14}}>VERLAUF</div>
          {[
            {time:"Heute, 10:15",lb:"Meldung eingegangen",done:true},
            {time:"Heute, 10:30",lb:"An Hausmeister zugewiesen",done:true},
            {time:"Heute, 11:05",lb:"In Arbeit",done:false,now:true},
            {time:"Offen",lb:"Erledigt",done:false},
          ].map((st,i,a)=>(
            <div key={i} style={{display:"flex",gap:10}}>
              <div style={{display:"flex",flexDirection:"column",alignItems:"center",width:18}}>
                <div style={{width:18,height:18,borderRadius:99,flexShrink:0,
                  border:`2px solid ${st.done||st.now?GR:BR}`,
                  background:st.done?GR:"transparent",
                  display:"flex",alignItems:"center",justifyContent:"center"}}>
                  {st.done&&<span style={{color:"#fff",fontSize:10,lineHeight:1}}>✓</span>}
                  {st.now&&<div style={{width:7,height:7,borderRadius:99,background:GR}}/>}
                </div>
                {i<a.length-1&&<div style={{width:2,flex:1,background:st.done?GR:BR,margin:"2px 0"}}/>}
              </div>
              <div style={{paddingBottom:i<a.length-1?12:0}}>
                <div style={{color:st.done||st.now?TX:MU,fontWeight:600,fontSize:12}}>{st.lb}</div>
                <div style={{color:MU,fontSize:10,marginTop:1}}>{st.time}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
      <div style={{display:"flex",background:WH,borderTop:`1px solid ${BR}`,flexShrink:0}}>
        {[["📋","Details"],["📈","Verlauf"]].map(([ic,lb],i)=>(
          <div key={lb} style={{flex:1,padding:"10px 0",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
            <span style={{fontSize:17,color:i===1?GR:MU}}>{ic}</span>
            <span style={{fontSize:9,color:i===1?GR:MU,fontWeight:i===1?700:400}}>{lb}</span>
          </div>
        ))}
      </div>
    </div>
  );

  const SCREENS = [Screen0, Screen1, Screen2, Screen3];

  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:18}}>
      <Phone dark={sc===0}>{SCREENS[sc]}</Phone>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
        <div style={{display:"flex",gap:6}}>
          {[0,1,2,3].map(i=>(
            <div key={i} onClick={()=>setSc(i)} style={{height:7,borderRadius:99,cursor:"pointer",
              width:sc===i?24:7,
              background:sc===i?"#fff":"rgba(255,255,255,0.25)",transition:"all .2s"}}/>
          ))}
        </div>
        <div style={{color:"rgba(255,255,255,0.45)",fontSize:11}}>{sc+1}/4 – {labels[sc]}</div>
      </div>
    </div>
  );
}

/* ── Hausmeister App ─────────────────────────────────────── */

const TASKS = [
  {id:1,ico:"🔧",t:"Heizungswartung",l:"Ahornweg 5",ti:"09:00",s:"o"},
  {id:2,ico:"🗑️",t:"Mülltonnen bereitstellen",l:"Ahornweg 5",ti:"11:00",s:"i"},
  {id:3,ico:"🏠",t:"Spielplatzkontrolle",l:"Sonnenweg 12",ti:"14:00",s:"o"},
  {id:4,ico:"💡",t:"Beleuchtung prüfen",l:"Ahornweg 7",ti:"Morgen 08:00",s:"o"},
  {id:5,ico:"🏚",t:"Dachrinnenreinigung",l:"Birkenstraße 3",ti:"15.05.",s:"e"},
];
const dotC = s => s==="e"?GR:s==="i"?OR:ML;

function HausmeisterApp() {
  const [tab, setTab]     = useState("d");
  const [atab, setAtab]   = useState("o");
  const [detail, setDetail] = useState(false);
  const [edit, setEdit]   = useState(false);
  const [route, setRoute] = useState(false);

  const filtered = atab==="o"?TASKS.filter(t=>t.s==="o"):atab==="i"?TASKS.filter(t=>t.s==="i"):TASKS.filter(t=>t.s==="e");

  if (edit) return (
    <Phone>
      <div style={{flex:1,background:BG,display:"flex",flexDirection:"column"}}>
        <MobHead back title="Meldung bearbeiten" onBack={()=>setEdit(false)}/>
        <div style={{flex:1,overflow:"auto",padding:12,display:"flex",flexDirection:"column",gap:10}}>
          <div style={{background:WH,borderRadius:12,padding:13,boxShadow:"0 1px 5px rgba(0,0,0,0.07)"}}>
            <div style={{color:MU,fontSize:9,fontWeight:800,letterSpacing:0.8,marginBottom:8}}>STATUS</div>
            <select defaultValue="In Arbeit" style={{width:"100%",background:BG,border:`1px solid ${BR}`,
              borderRadius:9,padding:"9px 11px",fontSize:12,color:TX,outline:"none",fontFamily:F}}>
              {["Neu","Zugewiesen","In Arbeit","Erledigt"].map(v=><option key={v}>{v}</option>)}
            </select>
          </div>
          <div style={{background:WH,borderRadius:12,padding:13,boxShadow:"0 1px 5px rgba(0,0,0,0.07)"}}>
            <div style={{color:MU,fontSize:9,fontWeight:800,letterSpacing:0.8,marginBottom:8}}>NOTIZ</div>
            <textarea defaultValue="Leck gefunden und provisorisch abgedichtet. Klempner ist informiert."
              style={{width:"100%",minHeight:70,background:BG,border:`1px solid ${BR}`,
                borderRadius:9,padding:"8px 10px",fontSize:12,color:TX,outline:"none",
                resize:"none",boxSizing:"border-box",fontFamily:F}}/>
          </div>

                <div style={{color:MU,fontSize:10,marginBottom:3}}>Datum</div>
                <div style={{fontWeight:700}}>{cur.datum}</div>
              </div>
            </div>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead>
                <tr style={{borderBottom:`2px solid ${BR}`,background:B2}}>
                  {["Beschreibung","Menge","Einzelpreis","Gesamt"].map(h=>(
                    <th key={h} style={{padding:"7px 8px",textAlign:"left",color:MU,fontWeight:700,fontSize:10}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                <tr style={{borderBottom:`1px solid ${BR}`}}>
                  <td style={{padding:"9px 8px",color:T2}}>Hausmeister-Service Leistung</td>
                  <td style={{padding:"9px 8px"}}>2,0 h</td>
                  <td style={{padding:"9px 8px"}}>75,00 €</td>
                  <td style={{padding:"9px 8px",fontWeight:700}}>{cur.betrag}</td>
                </tr>
              </tbody>
            </table>
            <div style={{display:"flex",justifyContent:"flex-end",marginTop:14,paddingTop:14,borderTop:`2px solid ${TX}`}}>
              <div style={{textAlign:"right"}}>
                <div style={{color:MU,fontSize:11,marginBottom:2}}>Gesamtbetrag</div>
                <div style={{fontWeight:900,fontSize:22,color:TX,letterSpacing:-.5}}>{cur.betrag}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  };

  const titles = {rollen:"Hausmeister-Rollen",rechnungen:"Rechnungen",einstellungen:"Einstellungen"};

  return (
    <div style={{display:"flex",height:"100%"}}>
      <Sidebar items={HS_ITEMS} active={nav} onNav={setNav}/>
      <div style={{flex:1,display:"flex",flexDirection:"column",background:BG,overflow:"hidden"}}>
        <WebBar title={titles[nav]} avatar="HS"/>
        <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
          {nav==="rollen"&&<RollenView/>}
          {nav==="rechnungen"&&<RechnungenHSView/>}
          {nav==="einstellungen"&&(
            <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:MU,fontSize:13}}>
              Einstellungen – demnächst verfügbar
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── Main App ────────────────────────────────────────────── */

const TABS = [
  ["qr",  "📱", "Bewohner QR"],
  ["app", "🔧", "Hausmeister App"],
  ["adm", "🛡️", "Admin Portal"],
  ["hv",  "🏢", "HV Portal"],
  ["inv", "💶", "Rechnungen"],
  ["hs",  "🏠", "Hausmeister-Service"],
];

function App() {
  const [view, setView] = useState("qr");
  const mobile = view==="qr"||view==="app";

  return (
    <div style={{minHeight:"100vh",background:"#0e1822",display:"flex",flexDirection:"column"}}>
      <div style={{background:"#091120",borderBottom:"1px solid rgba(255,255,255,0.07)",
        display:"flex",alignItems:"stretch",padding:"0 20px",gap:0,flexShrink:0,overflowX:"auto"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,paddingRight:24,
          borderRight:"1px solid rgba(255,255,255,0.07)",marginRight:8,flexShrink:0}}>
          <div style={{width:28,height:28,borderRadius:7,
            background:`linear-gradient(135deg,${GR},${GD})`,
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>🏠</div>
          <div>
            <div style={{color:"#fff",fontSize:11,fontWeight:900,letterSpacing:-0.2}}>DEIN HAUSMEISTER</div>
            <div style={{color:GR,fontSize:8,fontWeight:700,letterSpacing:2}}>BETA v0.2</div>
          </div>
        </div>
        {TABS.map(([k,ic,lb])=>(
          <button key={k} onClick={()=>setView(k)} style={{
            display:"flex",alignItems:"center",gap:6,padding:"0 16px",border:"none",
            background:"none",cursor:"pointer",fontFamily:F,fontWeight:view===k?700:500,
            fontSize:12,color:view===k?"#fff":"rgba(255,255,255,0.4)",
            borderBottom:view===k?`2.5px solid ${GR}`:"2.5px solid transparent",
            transition:"all .15s",whiteSpace:"nowrap"}}>
            <span style={{fontSize:14}}>{ic}</span>{lb}
          </button>
        ))}
      </div>

      {mobile?(
        <div style={{flex:1,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"36px 24px"}}>
          {view==="qr" &&<QRFlow/>}
          {view==="app"&&<HausmeisterApp/>}
        </div>
      ):(
        <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
          {view==="adm"&&<AdminPortal/>}
          {view==="hv" &&<HVPortal/>}
          {view==="inv"&&<Rechnungen/>}
          {view==="hs" &&<HausmeisterService/>}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
